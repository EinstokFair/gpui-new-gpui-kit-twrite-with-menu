# vendor-upstream/manifest.toml
# Описывает, откуда брать локальные крейты в vendor/.
# Источники: git (snapshot zed@93d7456), generated (generate/*.sh).
# Число секций [[crate]] меняется: tools/vendor-close.sh дописывает
# недостающие upstream-крейты автоматически.

# --- gpui-pre (snapshot zed@93d7456) ---
[[crate]]
name = "gpui-pre-local"
source = "git"
url = "https://github.com/zed-industries/zed"
rev = "93d745668805029476e6d7fbb19652116fed51de"
subdir = "crates/gpui"
patch = "patches/gpui-pre-local.patch"

[[crate]]
name = "gpui-pre-linux"
source = "git"
url = "https://github.com/zed-industries/zed"
rev = "93d745668805029476e6d7fbb19652116fed51de"
subdir = "crates/gpui_linux"
patch = "patches/gpui-pre-linux.patch"

# --- gpui (обёртка над gpui-pre) ---
[[crate]]
name = "gpui-local"
source = "generated"
generator = "generate/gpui-local.sh"

